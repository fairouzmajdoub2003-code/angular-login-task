<div class="page">
  <nav class="navbar">
    <span class="brand">Color Game</span>

    <div class="nav-right">
      <span class="username">{{ username }}</span>

      <button
        type="button"
        class="logout-link"
        (click)="showLogoutConfirmation()"
      >
        Logout
      </button>
    </div>
  </nav>

  <div class="logout-confirmation" *ngIf="confirmingLogout">
    <span>Voulez vous vraiment vous déconnecter ?</span>

    <button
      type="button"
      class="yes-button"
      (click)="confirmLogout()"
    >
      Oui
    </button>
  </div>

  <main class="home-content">
    <button
      type="button"
      class="game-button"
      (click)="openColorGame()"
    >
      Color Game
    </button>
  </main>
</div>
