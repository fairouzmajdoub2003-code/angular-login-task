<div class="page">
  <nav class="navbar">
    <span class="brand">Color Game</span>
    <span class="nav-login">Login</span>
  </nav>

  <div class="login-container">
    <h1>Login</h1>

    <form #loginForm="ngForm">
      <label>Username</label>

      <input
        type="text"
        name="username"
        placeholder="Username"
        required
        minlength="7"
        ngModel
        #username="ngModel"
      />

      <small class="error" *ngIf="username.invalid && username.touched">
        Username must contain at least 7 characters.
      </small>

      <label>Password</label>

      <input
        type="password"
        name="password"
        placeholder="Password"
        required
        minlength="6"
        ngModel
        #password="ngModel"
      />

      <small class="error" *ngIf="password.invalid && password.touched">
        Password must contain at least 6 characters.
      </small>

      <button type="submit" [disabled]="loginForm.invalid">
        Login
      </button>
    </form>
  </div>
</div>
