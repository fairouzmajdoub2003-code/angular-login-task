<div class="page">
  <nav class="navbar">
    <span class="brand">Color Game</span>
    <span class="nav-login">Login</span>
  </nav>

  <main class="login-container">
    <h1>Login</h1>

    <div class="credential-alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" novalidate>
      <label for="username">Email</label>

      <div
        class="input-group"
        [class.invalid-group]="
          usernameField.invalid &&
          (usernameField.touched || loginForm.submitted)
        "
        [class.valid-group]="
          usernameField.valid &&
          usernameField.touched
        "
      >
        <span class="input-icon">@</span>

        <input
          id="username"
          type="text"
          name="username"
          placeholder="Username"
          required
          minlength="7"
          [(ngModel)]="username"
          #usernameField="ngModel"
        />

        <span
          class="status-icon invalid-icon"
          *ngIf="
            usernameField.invalid &&
            (usernameField.touched || loginForm.submitted)
          "
        >
          !
        </span>

        <span
          class="status-icon valid-icon"
          *ngIf="usernameField.valid && usernameField.touched"
        >
          ✓
        </span>
      </div>

      <div
        class="validation-message"
        *ngIf="
          usernameField.errors?.required &&
          (usernameField.touched || loginForm.submitted)
        "
      >
        * required : true
      </div>

      <div
        class="validation-message"
        *ngIf="
          usernameField.errors?.minlength &&
          (usernameField.touched || loginForm.submitted)
        "
      >
        * email : false
      </div>

      <div
        class="validation-message"
        *ngIf="
          usernameField.errors?.minlength &&
          (usernameField.touched || loginForm.submitted)
        "
      >
        * Longueur min 6 caractères
      </div>

      <label for="password">Password</label>

      <div
        class="input-group"
        [class.invalid-group]="
          passwordField.invalid &&
          (passwordField.touched || loginForm.submitted)
        "
        [class.valid-group]="
          passwordField.valid &&
          passwordField.touched
        "
      >
        <span class="input-icon">🔒</span>

        <input
          id="password"
          type="password"
          name="password"
          placeholder="Password"
          required
          minlength="6"
          [(ngModel)]="password"
          #passwordField="ngModel"
        />

        <span
          class="status-icon invalid-icon"
          *ngIf="
            passwordField.invalid &&
            (passwordField.touched || loginForm.submitted)
          "
        >
          !
        </span>

        <span
          class="status-icon valid-icon"
          *ngIf="passwordField.valid && passwordField.touched"
        >
          ✓
        </span>
      </div>

      <div
        class="validation-message"
        *ngIf="
          passwordField.errors?.required &&
          (passwordField.touched || loginForm.submitted)
        "
      >
        * required : true
      </div>

      <div
        class="validation-message"
        *ngIf="
          passwordField.errors?.minlength &&
          (passwordField.touched || loginForm.submitted)
        "
      >
        Longueur min 5 caractères
      </div>

      <button type="submit">
        {{ isLoading ? 'Loading...' : 'Login' }}
      </button>
    </form>
  </main>
</div>
